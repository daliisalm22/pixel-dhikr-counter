<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>𐙚 pixel dhikr counter ⋆.˚˖࿔ ࣪</title>
    </head>
    <body>
        <h1>𐙚 pixel dhikr counter ⋆.˚˖࿔</h1>
        <p>⊹₊ ⋆.𖥔 ݁ ˖⋆.ೃ࿔*:･٠ ࣪⭑</p>

        <div class="app-container">
            <div class="text-area">
                <h2 id="english-text">Subhanallah</h3>
                <h2 id="arabic-text">سُبْحَانَ ٱللَّٰهِ</h3>
            </div>
            <div class ="witch-controls">
                <button id="prev-btn" style="background-color: var(--white);">◀</button>
                <button id="next-btn" style="background-color: var(--white);">▶</button>
            </div>

            <div class="counter">
                <img id="counter-img" src="img/counter-img.png" alt="img of the counter">
                <br>
            </div>

            <div class="controls-area">
                <br>
                <div class="color-buttons">
                    <button class="color-btn" data-color="var(--pink)" style="background-color: var(--pink);"></button>
                    <button class="color-btn" data-color="var(--yellow)" style="background-color: var(--yellow);"> </button>
                    <button class="color-btn" data-color="var(--green)" style="background-color: var(--green);"> </button>
                    <button class="color-btn" data-color="var(--blue)" style="background-color: var(--blue);"> </button>
                    <button class="color-btn" data-color="var(--purple)" style="background-color: var(--purple);"> </button>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" style="background-color: var(--white);"> </button>
                    <button class="action-btn" style="background-color: var(--white);"> </button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
